name: Deploy Branch to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare GitHub Pages artifact
        run: |
          cp dist/index.html dist/404.html
          test -f dist/assets/index-*.js
          test -f dist/assets/index-*.css
          echo "Built files:"
          find dist -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify deployed assets
        run: |
          SITE_URL="${{ steps.deployment.outputs.page_url }}"
          echo "Site URL: $SITE_URL"
          curl -fsSL "$SITE_URL" | tee /tmp/index.html
          JS_PATH=$(grep -oE '/Branch/assets/index-[^"]+\.js' /tmp/index.html | head -1)
          CSS_PATH=$(grep -oE '/Branch/assets/index-[^"]+\.css' /tmp/index.html | head -1)
          test -n "$JS_PATH"
          test -n "$CSS_PATH"
          curl -fsSL "https://jing-gou.github.io${JS_PATH}" -o /dev/null
          curl -fsSL "https://jing-gou.github.io${CSS_PATH}" -o /dev/null
          echo "Asset checks passed."
